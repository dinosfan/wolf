<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10152d"><meta name="description" content="각자 휴대폰으로 즐기는 실시간 단어 순발력 파티게임">
  <title>번뜩! — 함께 외치는 단어 배틀</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#f7f8ff;background:#0c1021;--muted:#aeb8dc;--line:rgba(196,212,255,.17);--accent:#f6cd64;--surface:#1b2443;--radius:22px}
    *,*::before,*::after{box-sizing:border-box}html{min-height:100%;background:#0c1021}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 30% -10%,#293767 0,transparent 48%),radial-gradient(ellipse at 120% 60%,#202b53 0,transparent 36%),#0c1021}
    button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.42}a{color:inherit}
    .shell{max-width:960px;margin:auto;min-height:100dvh;padding:24px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:850;letter-spacing:-.03em;color:#f5f6ff}.brandmark{display:grid;place-items:center;background:linear-gradient(145deg,#ffe38e,#f4a94f);box-shadow:0 6px 22px #edac6833;color:#1a1e30;border-radius:14px;width:44px;height:44px;font-size:26px;transform:rotate(-5deg)}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{color:#ffd878;font-size:12px;letter-spacing:.18em;font-weight:800;text-transform:uppercase}
    .hero{padding:30px 4px 14px;text-align:center}.hero .bolt{font-size:64px;filter:drop-shadow(0 0 22px #ffb56088)}h1{font-size:clamp(42px,12vw,69px);letter-spacing:-.065em;line-height:1.1;margin:10px 0 16px}h1 span{color:#ffcf66}h2{margin:0 0 10px;font-size:23px;letter-spacing:-.045em}h3{margin:0 0 8px;font-size:17px}.hero p{font-size:16px;color:#b8c4e8;line-height:1.7;margin:0 auto 20px;max-width:390px}
    .surface{background:linear-gradient(155deg,rgba(39,51,92,.95),rgba(22,31,57,.98));border:1px solid var(--line);box-shadow:0 16px 45px #070d2055;border-radius:var(--radius);padding:20px;margin-bottom:14px}
    .onboard{max-width:465px;margin:auto}.tabs{display:flex;border:1px solid var(--line);background:#111a32;border-radius:15px;padding:4px;margin-bottom:20px}.tabs button{flex:1;color:#aeb8dc;background:none;border:0;padding:12px;border-radius:11px;font-weight:750}.tabs button.active{background:#314270;color:white;box-shadow:0 3px 12px #070d2077}
    label{display:block;margin:15px 0 7px;color:#d6def9;font-weight:730;font-size:13px}input,select{border:1px solid #5a698d;background:#121b34;border-radius:12px;color:white;width:100%;padding:13px 14px;outline:0;min-height:48px}input:focus,select:focus{border-color:#ffdb80;box-shadow:0 0 0 3px #ffdb8020}input::placeholder{color:#7e90bc}
    .dual{display:grid;grid-template-columns:1fr 1fr;gap:10px}.button{appearance:none;background:#33436a;color:#fff;border:1px solid #52638d;border-radius:14px;padding:14px 16px;font-weight:820;font-size:15px;min-height:49px;transition:transform .1s,background .1s}.button:active:not(:disabled){transform:scale(.97)}.primary{background:linear-gradient(145deg,#ffe08e,#f9bb54);color:#20243a;border:0;box-shadow:0 6px 14px #d99c4633}.secondary{background:#27365c}.ghost{background:transparent;border:1px solid var(--line);color:#bfcbee;box-shadow:none}.full{width:100%}.danger{background:#532b48;border-color:#a9596b}
    .hint{font-size:13px;line-height:1.7;color:#a9b9e3;margin:12px 2px}.instructions{max-width:550px;margin:24px auto}.steps{display:grid;gap:8px}.step{display:flex;gap:12px;align-items:center;background:#141d37;border-radius:13px;padding:12px;font-size:14px;color:#dce4ff}.number{flex-shrink:0;width:27px;height:27px;border-radius:9px;background:#384977;display:grid;place-items:center;color:#ffd878;font-weight:900}
    .topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}.code{font-weight:950;color:#ffdc83;font-size:20px;letter-spacing:.15em;font-variant-numeric:tabular-nums}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#263a60;color:#c5d5ff;white-space:nowrap}.status.warn{color:#ffd58d;background:#4d3d35}.top-actions{display:flex;gap:7px}.mini{background:#25345a;color:#e5ebff;border:1px solid var(--line);padding:7px 11px;border-radius:10px;font-weight:780;font-size:12px}
    .player-list{display:grid;gap:10px}.person{display:flex;align-items:center;gap:11px;background:#131d38;border:1px solid #3a4770;border-radius:15px;padding:12px}.avatar{width:38px;height:38px;display:grid;place-items:center;background:#293b67;color:#fdd777;border-radius:13px;font-weight:950;flex-shrink:0}.person>div:nth-child(2){flex:1;min-width:0}.person-name{font-size:15px;font-weight:850;overflow-wrap:anywhere}.pill{margin-left:auto;font-size:11px;border-radius:50px;padding:5px 10px;background:#253a59;color:#b3c9ec;white-space:nowrap}.pill.ready{color:#baf8ce;background:#1b473e}.pill.offline{color:#facab8;background:#533544}.room-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}.chip{padding:6px 10px;border-radius:8px;background:#1a2947;border:1px solid var(--line);font-size:12px;color:#bdc9ea}
    .bot-tools{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0 4px}.bot-tools button{flex:1;min-width:120px}.person.bot{border-color:#7b6ab1;background:#252044}.person.bot .avatar{background:#503b78}.remove-bot{font-size:12px;padding:6px 9px;border-radius:9px;background:#50314b;color:#ffe5eb;border:1px solid #955b7e;flex-shrink:0}.bot-help{font-size:12px;color:#c5c3ef;line-height:1.6;margin:10px 2px}.bot-duel-note{margin-top:11px;font-size:13px;color:#f8dc91;line-height:1.6}.bigline{font-size:17px;font-weight:850;line-height:1.45}.game-layout{display:grid;gap:14px}.headline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.notice{background:#283755;border:1px solid #4b608d;border-radius:14px;padding:13px 15px;margin:12px 0 18px;color:#f2e4c3;line-height:1.5;font-size:14px}.notice.duel{border-color:#ffce7d;background:#493940;color:#fff2d5;box-shadow:0 0 24px #ffc67d25}
    .arena{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pile{position:relative;min-width:0}.pile-head{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;margin:0 1px 6px;min-height:22px}.pile-head strong{white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}.score{color:#ffd47d;font-weight:800;white-space:nowrap}.face{height:156px;border-radius:18px;background:#1b2849;border:1px dashed #4d608e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px;text-align:center;gap:6px;box-shadow:inset 0 2px 18px #0a123350;position:relative}.face.filled{background:linear-gradient(165deg,var(--tone-bg),#121d39 85%);border:2px solid var(--tone);box-shadow:0 8px 16px #070b1650,inset 0 0 26px var(--tone-bg)}
    .face .mark{font-weight:950;font-size:41px;line-height:1;color:var(--tone);text-shadow:0 2px 14px var(--tone-bg)}.face .topic{font-size:clamp(13px,3.9vw,17px);font-weight:900;line-height:1.25;letter-spacing:-.05em;overflow-wrap:anywhere;color:#fff;word-break:keep-all}.face .under{font-size:10px;color:#9eb2db}.pile.me .face{border-style:solid}.pile.pair .face{outline:3px solid #ffdb84;outline-offset:2px;animation:pulse 1.1s infinite alternate}@keyframes pulse{to{outline-color:#ffdb8466;filter:brightness(1.15)}}
    .arena.wide{grid-template-columns:repeat(3,minmax(0,1fr))}.arena.wide .face{height:134px}.arena.wide .face .mark{font-size:35px}.arena.wide .face .topic{font-size:13px}
    .wildzone{display:flex;gap:12px;align-items:center;justify-content:center;text-align:center;background:#191f3b;border:1px solid #536189;border-radius:15px;padding:12px;margin:12px 0}.wildzone .marks{font-size:29px;letter-spacing:.04em;font-weight:1000}.wildzone strong{display:block;font-size:13px}.wildzone em{font-size:12px;color:#b4c4e5;font-style:normal}
    .turnbox{text-align:center;background:#161f3b;border:1px solid var(--line);border-radius:16px;padding:15px 14px;margin-bottom:12px}.turnname{font-size:18px;font-weight:940;margin:5px 0 10px}.drawbtn{font-size:18px;min-height:60px}.duelbox{text-align:center;border:1px solid #f9cc74;background:linear-gradient(160deg,#4b374c,#262e4f);border-radius:18px;padding:17px 15px;margin-bottom:12px}.duelbox h2{font-size:27px;color:#ffdb87}.duelplayers{display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap;font-weight:890}.duelplayers b{font-size:21px}.answer-tip{margin:11px 0;font-size:13px;color:#f0deb8;line-height:1.6}.judge{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.judge button{font-size:14px;min-width:0;overflow-wrap:anywhere}
    .rank-row{display:flex;align-items:center;gap:11px;padding:13px 5px;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.ranknum{font-weight:900;font-size:22px;width:33px;color:#e3c277}.rank-row strong{flex:1}.rank-row .pts{color:#ffdb87;font-weight:920}.winner-title{text-align:center;font-size:35px;letter-spacing:-.06em}.offline-dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:#53d0a7;vertical-align:middle;margin-right:4px}.offline-dot.down{background:#ed8c98}.footer{font-size:11px;color:#8394b8;text-align:center;margin-top:20px;line-height:1.7}.hide{display:none!important}
    #toast{position:fixed;z-index:3;left:50%;bottom:24px;transform:translate(-50%,100px);background:#f9df9f;color:#24283d;border-radius:13px;padding:12px 20px;font-weight:850;box-shadow:0 15px 35px #070b1899;max-width:calc(100% - 35px);transition:transform .18s;min-width:220px;text-align:center;pointer-events:none}#toast.show{transform:translate(-50%,0)}
    @media(min-width:680px){.arena{grid-template-columns:repeat(3,minmax(0,1fr))}.game-layout{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.game-layout .side{position:sticky;top:16px}.face{height:185px}.face .topic{font-size:17px}.arena.wide{grid-template-columns:repeat(4,minmax(0,1fr))}.arena.wide .face{height:161px}.arena.wide .face .topic{font-size:15px}}@media(max-width:360px){.face{height:141px}.face .mark{font-size:34px}.face .topic{font-size:13px}.shell{padding-left:12px;padding-right:12px}.surface{padding:15px}.mini{padding:7px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body><main class="shell"><header class="header"><div class="brand"><div class="brandmark">ϟ</div><span>번뜩! <span class="muted small">PARTY</span></span></div><span id="connection" class="status">오프라인</span></header><div id="app"></div><footer class="footer">같은 공간에서 말로 대결하는 오리지널 단어 순발력 게임<br>정답과 속도 판정은 참가자들이 직접 결정합니다.</footer></main><div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const APP=document.getElementById('app'), conn=document.getElementById('connection'),toastEl=document.getElementById('toast');
  let auth=null,room=null,stream=null,busy=false,tab='create',toastTimer=null;
  const SAVE='beontteuk-auth-v1';
  const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const currentLink=()=>location.origin+'/?room='+encodeURIComponent(room?.code||auth?.code||'');
  function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),3000);}
  function connection(text,warning){conn.textContent=text;conn.className='status'+(warning?' warn':'');}
  async function api(action,data={}){
    const res=await fetch('/api/'+action,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...auth,...data})});
    const json=await res.json();if(!res.ok)throw Error(json.error||'요청에 실패했어요.');return json;
  }
  async function task(action,data){if(busy)return;busy=true;document.querySelectorAll('button[data-action]').forEach(e=>e.disabled=true);try{return await api(action,data);}catch(e){toast(e.message);}finally{busy=false;if(room)render();}}
  function save(a){auth=a;localStorage.setItem(SAVE,JSON.stringify(auth));}
  function reset(){stream?.close();stream=null;auth=null;room=null;localStorage.removeItem(SAVE);connection('오프라인',true);render();}
  async function connect(){stream?.close();try{room=await api('state');}catch(e){reset();toast('방이 만료되었어요. 다시 입장해 주세요.');return;}
    stream=new EventSource('/api/events?'+new URLSearchParams(auth));
    stream.onopen=()=>connection('실시간 연결됨',false);
    stream.onerror=()=>connection('재연결 중…',true);
    stream.onmessage=e=>{try{room=JSON.parse(e.data);render();}catch{}};
    render();
  }
  function landing(){const code=new URLSearchParams(location.search).get('room');return `
    <section class="hero"><div class="bolt">⚡</div><div class="eyebrow">FAST THINKING · LOUD ANSWERS</div><h1>생각보다 <span>입이 먼저!</span></h1><p>같은 공간에 모여 각자 휴대폰을 들어 봐. 같은 기호가 나오면 상대의 주제에 맞는 단어를 먼저 외쳐!</p></section>
    <section class="surface onboard"><div class="tabs"><button data-tab="create" class="${tab==='create'?'active':''}">방 만들기</button><button data-tab="join" class="${tab==='join'?'active':''}">방 들어가기</button></div>
      <form id="entry"><label for="name">닉네임</label><input name="name" id="name" autocomplete="nickname" maxlength="14" placeholder="예: 번개왕" required>
        ${tab==='create'?`<div class="dual"><div><label for="seats">최대 인원</label><select name="seats" id="seats">${[3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===6?'selected':''}>${n}명</option>`).join('')}</select></div><div><label for="cards">카드 수</label><select name="cards" id="cards"><option value="60">빠르게 · 60장</option><option value="96" selected>기본 · 96장</option><option value="120">길게 · 120장</option></select></div></div>`:`<label for="code">초대 코드</label><input name="code" id="code" maxlength="5" placeholder="5자리 코드" autocomplete="off" style="text-transform:uppercase" value="${escape(code?.toUpperCase()||'')}">`}
        <button class="button primary full" style="margin-top:21px" type="submit">${tab==='create'?'방 만들고 친구 초대하기':'방 입장하기'} →</button></form>
    </section><section class="instructions"><div class="steps"><div class="step"><span class="number">1</span>카드를 넘기다가 같은 기호가 나오면 대결!</div><div class="step"><span class="number">2</span>상대 카드의 주제에 맞는 단어를 먼저 외쳐요.</div><div class="step"><span class="number">3</span>이기면 상대 카드 1장을 획득. 최다 획득자가 우승!</div></div></section>`;}
  const person=p=>`<div class="person ${p.isBot?'bot':''}"><div class="avatar">${p.isBot?'🤖':escape(p.name.charAt(0))}</div><div><div class="person-name">${escape(p.name)} ${p.isBot?'· 연습봇':''} ${p.id===room.meId?'(나)':''} ${p.id===room.hostId?'👑':''}</div><span class="small muted">${p.isBot?'자동 플레이':`<span class="offline-dot ${p.online?'':'down'}"></span>${p.online?'접속 중':'재접속 대기'}`}</span></div><span class="pill ${p.ready?'ready':''}">${p.ready?'준비 완료':'대기 중'}</span>${p.isBot&&room.own.host?`<button class="remove-bot" data-action="removeBot" data-bot="${p.id}" aria-label="${escape(p.name)} 제거">빼기</button>`:''}</div>`;
  function topbar(){return `<div class="topbar"><div><div class="small muted">우리 방 코드</div><div class="code">${escape(room.code)}</div></div><div class="top-actions"><button class="mini" data-action="copy">초대 링크</button><button class="mini" data-action="leave">나가기</button></div></div>`;}
  function lobby(){const amHost=room.own.host,ready=room.players.every(p=>p.ready),online=room.players.every(p=>p.online);return `${topbar()}<section class="surface"><div class="eyebrow" style="margin-bottom:8px">WAITING ROOM</div><h2>참가자 준비 ⚡</h2><p class="muted small">혼자 연습하려면 아래에서 봇 2명을 추가하면 돼요. 친구도 언제든 초대할 수 있어요.</p><div class="room-meta"><span class="chip">${room.players.length}/${room.settings.seats}명</span><span class="chip">${room.settings.cards}장 · ${room.settings.cards===60?'짧게':room.settings.cards===120?'길게':'기본'}</span><span class="chip">현장 음성 · 연습봇 지원</span></div><div class="player-list">${room.players.map(person).join('')}</div>
    ${amHost?`<div class="bot-tools"><button class="button secondary" data-action="addBot" data-count="1" ${room.players.length>=room.settings.seats?'disabled':''}>🤖 봇 1명 추가</button><button class="button secondary" data-action="addBot" data-count="2" ${room.players.length+2>room.settings.seats?'disabled':''}>⚡ 봇 2명 추가</button></div><p class="bot-help">봇은 자동으로 카드를 넘기고, 사람과 대결하면 약 9초 뒤 가상 승리해요. 정답을 먼저 외쳤다면 승리 버튼을 누르세요. 음성 인식은 사용하지 않아요.</p>`:''}
    ${amHost?`<div class="dual"><div><label for="seats">인원 제한</label><select id="seats" data-setting="seats">${[3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===room.settings.seats?'selected':''} ${n<room.players.length?'disabled':''}>${n}명</option>`).join('')}</select></div><div><label for="cards">카드 수</label><select id="cards" data-setting="cards">${[60,96,120].map(n=>`<option value="${n}" ${n===room.settings.cards?'selected':''}>${n}장</option>`).join('')}</select></div></div><button class="button primary full" style="margin-top:18px" data-action="start" ${room.players.length<3||!ready||!online?'disabled':''}>게임 시작하기 ⚡</button><p class="hint">${room.players.length<3?'최소 3명 필요해요.':!ready?'모든 친구가 준비해야 시작할 수 있어요.':!online?'모든 친구의 연결을 기다리고 있어요.':'준비 완료! 바로 시작할 수 있어요.'}</p>`:`<button class="button ${room.own.ready?'secondary':'primary'} full" style="margin-top:18px" data-action="ready">${room.own.ready?'준비 취소':'준비 완료 ✓'}</button><p class="hint">방장이 게임을 시작하면 자동으로 화면이 바뀝니다.</p>`}
    </section><section class="surface"><h3>어떻게 해요?</h3><p class="hint">내 차례에 카드 한 장을 공개해요. 다른 사람의 맨 위 카드와 기호가 같으면 그 사람의 주제에 맞는 말을 먼저 외쳐요. 방장이 현장에서 승자를 판정해요. 와일드카드와 연쇄 대결도 자동으로 처리됩니다.</p></section>`;}
  function tile(p){const c=p.top;const mark=c?room.symbols[c.symbol]:null;const matched=!!room.duel&&(room.duel.aId===p.id||room.duel.bId===p.id);
    return `<div class="pile ${p.id===room.meId?'me':''} ${matched?'pair':''}"><div class="pile-head"><strong>${escape(p.name)}${p.id===room.meId?' (나)':''}</strong><span class="score">★ ${p.score}</span></div><div class="face ${c?'filled':''}" style="${c?`--tone:${mark.color};--tone-bg:${mark.color}22`:''}">${c?`<span class="mark">${mark.mark}</span><span class="topic">${escape(c.topic)}</span><span class="under">공개 ${p.pileCount}장</span>`:`<span style="font-size:27px;color:#798db8">?</span><span class="under">공개된 카드 없음</span>`}</div></div>`;
  }
  function wild(){if(!room.wild)return '';const [a,b]=room.wild.symbols;return `<div class="wildzone"><div class="marks"><span style="color:${room.symbols[a].color}">${room.symbols[a].mark}</span><span style="color:${room.symbols[b].color}">${room.symbols[b].mark}</span></div><div><strong>와일드카드 활성화</strong><em>이 두 기호도 서로 대결합니다</em></div></div>`;}
  function side(){const me=room.players.find(p=>p.id===room.meId),turn=room.players.find(p=>p.id===room.turnPlayerId);
    if(room.phase==='duel') {const d=room.duel,a=room.players.find(p=>p.id===d.aId),b=room.players.find(p=>p.id===d.bId),bothBots=a.isBot&&b.isBot,oneBot=a.isBot!==b.isBot;
      const instructions=bothBots?'두 봇이 자동으로 대결하고 있어요…':oneBot?'봇은 약 9초 후 자동 승리해요. 그 전에 정답을 외쳤다면 아래 버튼으로 승리하세요! (음성 인식 X)':'현장에서 먼저 정답을 말한 사람을 선택하세요.';
      return `<div class="duelbox"><div class="eyebrow">FACE OFF · ${d.reason==='wild'?'WILD MATCH':'SYMBOL MATCH'}</div><h2>⚡ 대결!</h2><div class="duelplayers"><b>${escape(a.name)}</b> VS <b>${escape(b.name)}</b></div><p class="answer-tip"><strong>${escape(a.name)}</strong>님은 <strong>「${escape(b.top?.topic||'')}」</strong>에 답하고<br><strong>${escape(b.name)}</strong>님은 <strong>「${escape(a.top?.topic||'')}」</strong>에 답해요.</p><p class="bot-duel-note">${instructions}</p>${room.own.host&&!bothBots?`<div class="judge"><button data-action="resolve" data-duel="${d.index}" data-winner="${a.id}" class="button primary">${a.id===room.meId?'내가 먼저 외쳤어!':escape(a.name)+' 승리'}</button><button data-action="resolve" data-duel="${d.index}" data-winner="${b.id}" class="button primary">${b.id===room.meId?'내가 먼저 외쳤어!':escape(b.name)+' 승리'}</button></div>`:`<div class="notice duel">${bothBots?'자동 판정 중…':'방장이 승리자를 선택하면 다음으로 넘어가요.'}</div>`}</div>`;}
    return `<div class="turnbox"><div class="eyebrow">NEXT CARD</div><div class="turnname">${room.turnPlayerId===room.meId?'내 차례!':escape(turn?.name||'')} ${room.turnPlayerId===room.meId?'⚡':'차례'}</div>${room.phase==='playing'&&room.turnPlayerId===room.meId?`<button class="button primary full drawbtn" data-action="draw">카드 공개하기 →</button>`:`<div class="hint">${turn?.isBot?'🤖 봇이 자동으로 카드를 공개하고 있어요…':escape(turn?.name||'')+'님이 카드를 공개하길 기다려요.'}</div>`}<div class="small muted" style="margin-top:10px">남은 카드 ${room.deckLeft}장</div></div>`;
  }
  function board(){return `${topbar()}<div class="notice ${room.phase==='duel'?'duel':''}" aria-live="polite">${escape(room.lastEvent)}</div><div class="game-layout"><section class="surface"><div class="headline"><h3>공개된 카드</h3><span class="chip">⚡ ${room.players.length}명</span></div><div class="arena ${room.players.length>=7?'wide':''}">${room.players.map(tile).join('')}</div>${wild()}</section><aside class="side">${side()}<section class="surface" style="padding:15px"><h3>점수 현황</h3>${[...room.players].sort((a,b)=>b.score-a.score).map(p=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 2px;gap:10px;font-size:14px"><span>${escape(p.name)}</span><strong style="color:#ffda89">${p.score}장</strong></div>`).join('')}<div class="hint">이긴 사람은 상대의 공개된 맨 위 카드 1장을 가져갑니다.</div></section></aside></div>`;}
  function finished(){const ranked=[...room.players].sort((a,b)=>b.score-a.score);const winnerNames=ranked.filter(p=>room.winners.includes(p.id)).map(p=>p.name).join(', ');
    return `${topbar()}<section class="surface"><div style="font-size:62px;text-align:center;margin:10px 0">🏆</div><h2 class="winner-title">${escape(winnerNames)} 우승!</h2><p style="text-align:center;color:#bdc9eb">카드를 가장 많이 획득한 사람이 승리했어요.</p><div style="margin-top:26px">${ranked.map((p,i)=>`<div class="rank-row"><span class="ranknum">${i+1}</span><strong>${escape(p.name)} ${p.id===room.meId?'(나)':''}</strong><span class="pts">${p.score}장</span></div>`).join('')}</div>${room.own.host?'<button class="button primary full" data-action="restart" style="margin-top:22px">다시 한 판 ⚡</button>':'<p class="hint">방장이 재대결을 시작하면 다시 참여할 수 있어요.</p>'}</section>`;}
  function render(){APP.innerHTML=!auth?landing():!room?'<div class="surface">방에 연결하는 중…</div>':room.phase==='lobby'?lobby():room.phase==='finished'?finished():board();}
  document.addEventListener('click',async e=>{
    const btn=e.target.closest('button');if(!btn)return;
    if(btn.dataset.tab){tab=btn.dataset.tab;render();return;}
    const action=btn.dataset.action;if(!action)return;
    if(action==='copy'){try{if(navigator.share){await navigator.share({title:'번뜩! 같이 하자',text:`방 코드 ${room.code}`,url:currentLink()});return;}if(navigator.clipboard){await navigator.clipboard.writeText(currentLink());toast('초대 링크를 복사했어요!');return;}throw Error();}catch(err){if(err.name!=='AbortError')toast(`초대 코드: ${room.code}`);}return;}
    if(action==='leave'){if(!room||!['lobby','finished'].includes(room.phase))return toast('게임 중에는 나갈 수 없어요. 종료 후 나가거나 새로고침해서 복귀할 수 있어요.');if(!confirm('방을 나갈까요?'))return;try{await api('leave');reset();}catch(err){toast(err.message);}return;}
    if(action==='resolve')return task(action,{winnerId:btn.dataset.winner,duelIndex:Number(btn.dataset.duel)});
    if(action==='addBot')return task(action,{count:Number(btn.dataset.count||1)});
    if(action==='removeBot')return task(action,{botId:btn.dataset.bot});
    task(action);
  });
  document.addEventListener('submit',async e=>{
    if(e.target.id!=='entry')return;e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim();
    if(!name)return toast('닉네임을 입력해 주세요.');
    try{busy=true;const data=tab==='create'?{name,seats:Number(fd.get('seats')),cards:Number(fd.get('cards'))}:{name,code:String(fd.get('code')||'').trim().toUpperCase()};
      const joined=await api(tab,data);save(joined);history.replaceState(null,'','/?room='+encodeURIComponent(joined.code));await connect();
    }catch(err){toast(err.message);}finally{busy=false;}
  });
  document.addEventListener('change',e=>{
    if(!e.target.dataset.setting||!room?.own.host)return;
    const seats=Number(document.getElementById('seats').value),cards=Number(document.getElementById('cards').value);
    task('settings',{seats,cards});
  });
  try{const val=JSON.parse(localStorage.getItem(SAVE)||'null'),invite=new URLSearchParams(location.search).get('room');if(val&&val.code&&val.playerId&&val.token&&(!invite||invite.toUpperCase()===val.code)){auth=val;connect();}else {if(invite)tab='join';render();}}catch{reset();}
})();
</script>
</body>
</html>
