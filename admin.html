/* StageON content transport: browser-only demo and optional Supabase production backend. */
(function(){
  'use strict';
  const cfg=window.STAGEON_CONFIG||{};
  const base=(cfg.url||'').replace(/\/+$/,'');
  const key=cfg.anonKey||'';
  const enabled=Boolean(/^https:\/\/[\w-]+\.supabase\.co$/.test(base)&&key);
  function deepCopy(o){return JSON.parse(JSON.stringify(o));}
  function mergeData(partial){
    const d=deepCopy(window.STAGEON_DEFAULT_DATA);
    if(!partial||typeof partial!=='object')return d;
    if(partial.fields&&typeof partial.fields==='object')Object.assign(d.fields,partial.fields);
    if(typeof partial.brandColor==='string')d.brandColor=partial.brandColor;
    if(Array.isArray(partial.works))d.works=deepCopy(partial.works);
    if(Array.isArray(partial.facilities))d.facilities=deepCopy(partial.facilities);
    return d;
  }
  async function req(path,options={},token){
    if(!enabled)throw Error('온라인 게시 연결이 설정되지 않았습니다.');
    const headers={'apikey':key,...((token||key.startsWith('eyJ'))?{'Authorization':'Bearer '+(token||key)}:{}),...(options.headers||{})};
    const res=await fetch(base+path,{...options,headers});
    if(!res.ok){let msg='';try{const o=await res.json();msg=o.msg||o.message||o.error_description||o.error||'';}catch{}throw Error(msg||'서버 요청 실패 ('+res.status+')');}
    if(res.status===204)return null;
    const txt=await res.text();return txt?JSON.parse(txt):null;
  }
  async function getPublished(){
    if(!enabled)return null;
    const rows=await req('/rest/v1/site_content?id=eq.main&select=content',{headers:{'Accept':'application/json'}});
    return rows?.[0]?.content||null;
  }
  async function logIn(email,password){
    const data=await req('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    if(!data?.access_token)throw Error('로그인 토큰을 받지 못했습니다.');
    return data;
  }
  async function refreshToken(refresh){
    return req('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});
  }
  async function publish(data,token){
    // The database has a seeded 'main' row; RLS protects updates.
    return req('/rest/v1/site_content?id=eq.main',{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({content:data,updated_at:new Date().toISOString()})},token);
  }
  async function upload(file,token){
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('JPG, PNG, WEBP, GIF 사진만 지원합니다.');
    if(file.size>12*1024*1024)throw Error('사진은 12MB 이하여야 합니다.');
    const extension=file.type==='image/jpeg'?'jpg':file.type==='image/png'?'png':file.type==='image/gif'?'gif':'webp';
    const id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
    const filename=Date.now()+'-'+id+'.'+extension;
    if(!enabled)throw Error('온라인 사진 저장소가 설정되지 않았습니다.');
    const resp=await fetch(base+'/storage/v1/object/site-media/'+filename,{method:'POST',headers:{'apikey':key,'Authorization':'Bearer '+token,'Content-Type':file.type,'x-upsert':'false'},body:file});
    if(!resp.ok){let message='사진 업로드에 실패했습니다.';try{message=(await resp.json()).message||message;}catch{}throw Error(message);}
    return base+'/storage/v1/object/public/site-media/'+filename;
  }
  window.StageOnCMS={enabled,deepCopy,mergeData,getPublished,logIn,refreshToken,publish,upload};
})();

function status(message,kind='ok'){
  const s=$('status');s.textContent=message;s.className='status show'+(kind==='error'?' error':kind==='warn'?' warn':'');
}
function node(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e;}
function append(parent,...children){parent.append(...children);return parent;}
function button(label,fn,cls='btn'){
  const b=node('button',cls,label);b.type='button';b.addEventListener('click',fn);return b;
}
function panel(title,detail){const p=node('section','panel');p.append(node('h2',null,title));if(detail)p.append(node('p','detail',detail));mount.append(p);return p;}
function rawInput(parent,label,value,set,{multi=false,placeholder='',type='text'}={}){
  const wrap=node('div','field');const lab=node('label',null,label);const el=node(multi?'textarea':'input');
  if(!multi)el.type=type;el.value=value??'';el.placeholder=placeholder;
  el.addEventListener('input',()=>{set(el.value);changed();});
  wrap.append(lab,el);parent.append(wrap);return el;
}
function field(parent,key,label,opts={}){
  return rawInput(parent,label,data.fields[key]??'',v=>{data.fields[key]=v;},opts);
}
function photoInput(parent,label,read,write){
  const wrap=node('div','field');wrap.append(node('label',null,label));
  const zone=node('div','imagebox');const image=node('img');image.alt=label+' 미리보기';image.src=read()||'';
  if(!read())image.style.display='none';
  const controls=node('div','controls');
  controls.append(button('사진 선택',()=>{selectedPhoto={write,image,link};$('photoInput').value='';$('photoInput').click();}));
  controls.append(button('사진 주소 비우기',()=>{write('');image.removeAttribute('src');image.style.display='none';link.value='';changed();}));
  const link=node('input','link-input');link.type='text';link.value=read()||'';link.placeholder='https://... 또는 images/사진.jpg';
  link.addEventListener('change',()=>{write(link.value.trim());image.src=link.value.trim();image.style.display=link.value.trim()?'':'none';changed();});
  zone.append(image,controls,link);wrap.append(zone);parent.append(wrap);
}
function changeNav(section){

  renderFields();frame.src='./index.html?preview=1#'+(section==='settings'?'overview':section);$('status').className='status';
  if(innerWidth<740)window.scrollTo({top:0,behavior:'smooth'});
}
function changed(){

function downloadJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='StageON_콘텐츠백업_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),4000);status('백업 파일을 내려받았습니다. 안전한 폴더에 보관하세요.');}
$('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('파일 용량이 너무 큽니다.');const parsed=JSON.parse(await file.text());if(!parsed.fields||!Array.isArray(parsed.works)||!Array.isArray(parsed.facilities))throw Error('StageON 백업 파일 형식이 아닙니다.');data=cms.mergeData(parsed);redraw();status('백업 내용을 불러왔습니다. 변경 후 게시해야 실제 홈페이지에 반영됩니다.');}catch(err){status('불러오기 실패: '+err.message,'error');}e.target.value='';});
async function previewPhoto(file){if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('JPG, PNG, WEBP, GIF 사진만 올릴 수 있습니다.');if(file.size>12*1024*1024)throw Error('12MB 이하의 사진만 올려주세요.');
  if(file.type==='image/gif'){if(file.size>1_000_000)throw Error('움직이는 GIF는 1MB 이하만 로컬로 저장할 수 있습니다.');return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file);});}
  const original=await createImageBitmap(file);
  const scale=Math.min(1,1400/Math.max(original.width,original.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(original.width*scale));canvas.height=Math.max(1,Math.round(original.height*scale));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(original,0,0,canvas.width,canvas.height);original.close?.();
  return canvas.toDataURL('image/jpeg',.75);
}
$('photoInput').addEventListener('change',async e=>{const file=e.target.files?.[0],dest=selectedPhoto;if(!file||!dest)return;try{
 const uri=await previewPhoto(file);dest.write(uri);dest.image.src=uri;dest.image.style.display='';dest.link.value=uri;changed();status('사진이 편집 초안에 추가됐어요. 실제 게시할 때 온라인 이미지 저장소로 올립니다.');
 }catch(err){status('사진 변경 실패: '+err.message,'error');}e.target.value='';});
async function uploadPendingImages(content,token){const fields=content.fields;let count=0;
  async function push(uri){const blob=await (await fetch(uri)).blob();const suffix=blob.type.split('/')[1]||'jpeg';const file=new File([blob],'stageon-image.'+(suffix==='jpeg'?'jpg':suffix),{type:blob.type});const url=await cms.upload(file,token);count++;status('사진 업로드 '+count+'장 완료…');return url;}
  for(const [k,v] of Object.entries(fields))if(k.endsWith('.image')||['studios.map','contact.map','overview.image','hero.image'].includes(k)){if(typeof v==='string'&&v.startsWith('data:image/'))fields[k]=await push(v);}
  for(const obj of [...content.works,...content.facilities])if(typeof obj.image==='string'&&obj.image.startsWith('data:image/'))obj.image=await push(obj.image);
  return content;
}
async function publish(){
  if(!cms.enabled){changeNav('settings');status('온라인 게시를 하려면 우선 사이트 배포와 Supabase 연동이 필요해요. 설정·게시 연결 설명을 확인하세요.','warn');return;}
  if(!session?.access_token){changeNav('settings');status('게시하려면 먼저 관리자 계정으로 로그인하세요.','warn');return;}
  if(!confirm('현재 수정 내용을 공개 홈페이지에 게시할까요?'))return;
  const b=$('publishButton');b.disabled=true;
  try{const draft=copy(data);status('홈페이지에 게시 중입니다.');await uploadPendingImages(draft,session.access_token);
    const result=await cms.publish(draft,session.access_token);if(!Array.isArray(result)||result.length===0)throw Error('게시 권한이 없거나 업데이트가 적용되지 않았습니다.');
    data=cms.mergeData(draft);published=copy(data);saveDraft(false);renderFields();updatePreview();status('게시 완료! 공개 홈페이지 새로고침 시 변경 사항이 반영됩니다.');
  }catch(err){status('게시 실패: '+err.message+' 로그인 상태·관리자 권한·네트워크를 확인하세요.','error');}
  finally{b.disabled=false;}
}
